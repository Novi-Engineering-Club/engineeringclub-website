<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistics — Engineering Club</title>
    <meta name="description" content="Statistics and metrics for the Engineering Club." />
    <!-- Link to site stylesheet (adjust path as needed) -->
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js"></script>
</head>
<body>
    <section class="team-photo-banner">
        <div class="team-banner-content">
            <header class="hero" style="border-radius: 10%;">
                <h1>Project Statistics</h1>
                <p>Overview of filament consumption and money spent — interactive, accessible and responsive.</p>
            </header>

            <div class="stat-grid">
                <!-- Filament used card -->
                <div class="stat-card" id="filament-card" data-value="1200" data-total="2000" data-unit="g" data-color="#1d711d">
                    <div class="chart" style="--pct:0; --color1:#1d711d; --color2:#e9eef2;">
                        <div class="chart-arc" aria-hidden="true"></div>
                        <div class="chart-content">
                            <div class="stat-percent">0%</div>
                            <div class="stat-inner">0 g</div>
                        </div>
                    </div>
                    <h3>Filament used</h3>
                    <p class="stat-desc">of 2000 g spool</p>
                </div>

                <!-- Money spent card -->
                <div class="stat-card" id="money-card" data-value="180" data-total="500" data-unit="$" data-color="#035f2e">
                    <div class="chart" style="--pct:0; --color1:#035f2e; --color2:#f3efe9; --hole-bg:#fff;">
                        <div class="chart-arc" aria-hidden="true"></div>
                        <div class="chart-content">
                            <div class="stat-percent">0%</div>
                            <div class="stat-inner">$0</div>
                        </div>
                    </div>
                    <h3>Money spent</h3>
                    <p class="stat-desc">this project / term</p>
                </div>
            </div>

            <p style="text-align:center; color:#666; margin-top:18px;">Tip: values are editable in the HTML (data-value/data-total) or you can wire them to your backend.</p>
        </div>
    </section>

    <script>
    // Initialize statistic cards: compute percent, animate the donut arc and spin while syncing numbers
    (function initStats() {
        function animateCard(chart, pctNode, innerNode, startValue, endValue, duration, unit, color) {
            const startTime = performance.now();
            const startPct = 0;
            const endPct = Math.round((endValue / (Number(chart.closest('.stat-card').dataset.total) || endValue)) * 100);

            // target the arc element (we rotate only the arc so the numbers stay upright)
            const arc = chart.querySelector('.chart-arc') || chart;
            arc.style.setProperty('--color1', color);

            function step(now) {
                const t = Math.min(1, (now - startTime) / duration);

                // eased progress (easeOutCubic)
                const p = 1 - Math.pow(1 - t, 3);

                const currentPct = Math.round(startPct + (endPct - startPct) * p);
                arc.style.setProperty('--pct', currentPct);

                const currentVal = Math.round(startValue + (endValue - startValue) * p);
                pctNode.textContent = currentPct + '%';
                if (unit === '$') innerNode.textContent = '$' + currentVal;
                else innerNode.textContent = currentVal + ' ' + unit;

                // spin while animating (2 full spins over the duration)
                const rotation = p * 720; // degrees
                arc.style.transform = 'rotate(' + rotation + 'deg)';

                if (t < 1) requestAnimationFrame(step);
                else {
                    // finish settled state
                    arc.style.transform = 'rotate(0deg)';
                    arc.style.setProperty('--pct', endPct);
                }
            }
            requestAnimationFrame(step);
        }

        document.querySelectorAll('.stat-card').forEach(card => {
            const value = Number(card.dataset.value) || 0;
            const total = Number(card.dataset.total) || value || 1;
            const unit = card.dataset.unit || '';
            const color = card.dataset.color || '#1d711d';
            const chart = card.querySelector('.chart');
            const pctNode = card.querySelector('.stat-percent');
            const innerNode = card.querySelector('.stat-inner');

            // compute end percentage based on data attributes
            const endPct = Math.round((value / total) * 100);

            // set initial display values
            pctNode.textContent = '0%';
            innerNode.textContent = unit === '$' ? '$0' : '0 ' + unit;

            // animate chart (duration in ms)
            animateCard(chart, pctNode, innerNode, 0, value, 1100, unit, color);

            // update description text if total provided
            const desc = card.querySelector('.stat-desc');
            if (desc && total) {
                if (unit === '$') desc.textContent = 'of $' + total + ' budget';
                else desc.textContent = 'of ' + total + ' ' + unit;
            }
        });
    })();
    </script>
</body>
</html>
